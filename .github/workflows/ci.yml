name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # -Ppostgres runs the whole suite on a Testcontainers PostgreSQL 16; DatabaseEngineTest fails if it silently
      # fell back to H2. The runner's Docker daemon is used by Testcontainers.
      - run: ./mvnw -B verify -Ppostgres
        working-directory: backend

  frontend:
    name: Frontend audit, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B -DskipTests package
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  dependencies:
    name: Backend dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned Trivy version and same gate as the previous image scan (HIGH/CRITICAL findings with a fix
      # available, minus the entries justified in .trivyignore), applied to the source tree instead of a
      # container image: production deploys a plain jar on a Java host, so the image build is not part of CI.
      - run: >
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/.trivyignore:/.trivyignore:ro"
          -v trivy-cache:/root/.trivy-cache
          aquasec/trivy:0.76.1 fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --ignorefile /.trivyignore --exit-code 1 /src/backend

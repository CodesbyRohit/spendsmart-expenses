# Production: PostgreSQL only, credentials required from the environment, secure cookies, no API explorer.
spring:
  datasource:
    # DB_URL wins when set. Platforms such as Railway/Neon/Heroku/Render inject DATABASE_URL directly
    # (postgres://user:pass@host:5432/db?sslmode=require); PostgresUrlEnvironmentPostProcessor converts that
    # scheme to jdbc:postgresql:// and lifts the embedded credentials at startup, so no URL has to be copied
    # between dashboard fields. An empty default for username/password lets the URL's own userinfo apply;
    # explicit DB_USERNAME/DB_PASSWORD always win over it.
    url: ${DB_URL:${DATABASE_URL:}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  # Do NOT trust X-Forwarded-* by default: Tomcat treats any private-network peer (every client of a Docker
  # deployment) as a trusted proxy, so clients could spoof their IP and evade per-IP rate limits.
  # Behind a reverse proxy you control that overwrites these headers, set SERVER_FORWARD_HEADERS_STRATEGY=native
  # and restrict SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to that proxy's address (see docs/SECURITY.md).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}

app:
  docs:
    enabled: ${APP_API_DOCS_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:false}

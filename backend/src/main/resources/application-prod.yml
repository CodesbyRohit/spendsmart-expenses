# Production: PostgreSQL only, credentials required from the environment, secure cookies, no API explorer.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Do NOT trust X-Forwarded-* by default: Tomcat treats any private-network peer (every client of a Docker
  # deployment) as a trusted proxy, so clients could spoof their IP and evade per-IP rate limits.
  # Behind a reverse proxy you control that overwrites these headers, set SERVER_FORWARD_HEADERS_STRATEGY=native
  # and restrict SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to that proxy's address (see docs/SECURITY.md).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}

app:
  docs:
    enabled: ${APP_API_DOCS_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:false}

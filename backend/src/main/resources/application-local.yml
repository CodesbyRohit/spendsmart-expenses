# Zero-dependency local profile: an H2 database stored in ./data (no Docker or PostgreSQL needed).
# Runs the same Flyway migrations as PostgreSQL. Not intended for production data.
spring:
  datasource:
    url: jdbc:h2:file:./data/spendsmart-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

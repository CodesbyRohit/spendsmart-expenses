# Base configuration shared by every profile. Profile files override these values.
# Secrets are never stored here: every credential comes from an environment variable.
spring:
  application:
    name: spendsmart
  profiles:
    # "dev" = local PostgreSQL (see docker-compose.yml). Override with SPRING_PROFILES_ACTIVE.
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spendsmart}
    username: ${DB_USERNAME:spendsmart}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: SPENDSMART_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**

app:
  cors:
    # Comma-separated list. Empty = CORS disabled (same-origin deployment, the recommended setup).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    login-max-failures: 5
    login-lockout: 15m
    registration-per-ip-per-hour: 10
  web:
    # Directory containing the built React app (frontend/dist). Empty = API only.
    static-dir: ${APP_STATIC_DIR:}
  docs:
    enabled: ${APP_API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

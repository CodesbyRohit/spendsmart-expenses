# Local PostgreSQL, plus (optionally) the full application image.
#   docker compose up -d db          -> database only; run backend + frontend from source
#   docker compose --profile app up  -> database + the production-style image on http://localhost:8080
# Credentials come from .env (copy .env.example). Nothing secret is committed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spendsmart
      POSTGRES_USER: ${DB_USERNAME:-spendsmart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spendsmart-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d spendsmart"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/spendsmart
      DB_USERNAME: ${DB_USERNAME:-spendsmart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Plain http://localhost cannot carry Secure cookies. Behind HTTPS in real deployments, leave this true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  spendsmart-pg:
